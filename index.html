<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Fact Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1D4ED8', // Indigo 700
                        'secondary': '#60A5FA', // Blue 400
                        'accent': '#F59E0B', // Amber 500
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom styles for professional appearance */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #ffffff 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 960px;
        }
        .shadow-custom {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(29, 78, 216, 0.3);
        }
        /* Custom scrollbar for results */
        #results-container::-webkit-scrollbar {
            width: 8px;
        }
        #results-container::-webkit-scrollbar-thumb {
            background-color: #60A5FA;
            border-radius: 4px;
        }
        #results-container::-webkit-scrollbar-track {
            background-color: #e5e7eb;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container mx-auto">
        <header class="text-center py-6">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2 flex items-center justify-center">
                <svg class="w-8 h-8 mr-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.696 5.176-1.406 9-6.105 9-11.696C21 9 20.984 7.674 20.618 6.984z"></path></svg>
                Health Fact Checker
            </h1>
            <p class="text-lg text-gray-600">Verify health claims using your custom AI model.</p>
        </header>

        <main class="bg-white p-6 md:p-10 rounded-xl shadow-custom">
            
            <div class="mb-6">
                <label for="claimInput" class="block text-lg font-semibold text-gray-700 mb-3">
                    Enter Any Health Claim :
                </label>
                <input type="text" id="claimInput" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary text-base shadow-sm transition duration-150" 
                       placeholder="E.g., 'Applying tea tree oil cures acne'">
            </div>

            <button id="checkButton" class="btn-primary w-full bg-primary text-white font-bold py-3 rounded-lg shadow-lg uppercase tracking-wider disabled:opacity-50" disabled>
                Check Fact or Myth
            </button>

            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg flex items-center justify-center font-medium text-sm">
                <svg id="spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Analyzing claim... This may take a moment.
            </div>

            <div id="results-container" class="mt-8 pt-6 border-t border-gray-200">
                <p id="initialMessage" class="text-center text-gray-500 italic">
                    Enter a health claim above to get a fact-checked analysis from your custom model.
                </p>
                <div id="responseText" class="hidden bg-gray-50 p-6 rounded-lg shadow-inner text-base text-gray-700 max-h-96 overflow-y-auto whitespace-pre-wrap"></div>
                <div id="sourcesList" class="mt-6"></div>
            </div>

        </main>
    </div>

    <script>
    // --- CRITICAL CONFIGURATION ---
    // The final, correct API URL based on your username and Space name.
    const HUGGINGFACE_ENDPOINT = "https://samarthshukla-TinyHealth1-inference.hf.space/check_claim"; 
    // ------------------------------

    document.addEventListener('DOMContentLoaded', () => {
        // Set up variables
        const claimInput = document.getElementById('claimInput');
        const checkButton = document.getElementById('checkButton');
        const statusMessage = document.getElementById('statusMessage');
        const responseTextDiv = document.getElementById('responseText');
        const initialMessage = document.getElementById('initialMessage');
        const sourcesListDiv = document.getElementById('sourcesList');

        // --- Event Listeners and Initial Setup ---

        // Enable button only when claim field is filled
        function updateButtonState() {
            checkButton.disabled = !claimInput.value.trim();
        }

        claimInput.addEventListener('input', updateButtonState);
        updateButtonState();

        checkButton.addEventListener('click', handleFactCheck);

        // --- Core Functions ---

        async function handleFactCheck() {
            const userClaim = claimInput.value.trim();
            const TIMEOUT_MS = 360000; // Increased timeout for the cloud server (60 seconds)

            if (!userClaim) {
                setStatus('Error: Claim is missing.', 'bg-red-100 text-red-800 border-red-300', false);
                return;
            }

            // 1. Set Loading State
            initialMessage.classList.add('hidden');
            responseTextDiv.classList.add('hidden');
            sourcesListDiv.innerHTML = '';
            
            setStatus('Analyzing claim using custom TinyLlama model...', 'bg-yellow-100 text-yellow-800 border-yellow-300', true);
            checkButton.disabled = true;

            try {
                // Use AbortController for guaranteed timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), TIMEOUT_MS);

                const resultText = await callCustomModelAPI(userClaim, controller.signal);
                
                clearTimeout(timeoutId);
                
                // 2. Display Results
                const formattedText = formatGeminiResponse(resultText); 
                responseTextDiv.innerHTML = formattedText;
                responseTextDiv.classList.remove('hidden');
                
                // Final UI update
                sourcesListDiv.innerHTML = '<p class="text-sm text-gray-500 italic">Analysis powered by your custom TinyLlama model.</p>';
                setStatus('Analysis Complete.', 'bg-green-100 text-green-800 border-green-300', false);

            } catch (error) {
                // 3. Handle Error
                console.error('Fact checking failed:', error);
                let errorMessage = `Error: ${error.message}.`;
                
                if (error.name === 'AbortError') {
                     errorMessage = 'Request Timed Out (60s limit exceeded). The cloud server is slow or sleeping. Please try again.';
                } else if (error.message.includes('404')) {
                    errorMessage = 'Server Not Found. Check if the Hugging Face Space is spelled correctly and is running.';
                } else if (error.message.includes('500')) {
                    errorMessage = 'Internal Server Error. The model may have crashed while loading. Check the Space logs.';
                }
                
                setStatus(errorMessage, 'bg-red-100 text-red-800 border-red-300', false);
                
            } finally {
                checkButton.disabled = false;
            }
        }

        /**
         * NEW FUNCTION: Calls the Hugging Face Inference Endpoint.
         */
        async function callCustomModelAPI(claim, signal) {
            
            const response = await fetch(HUGGINGFACE_ENDPOINT, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    claim: claim 
                }),
                signal: signal
            });
            
            if (signal.aborted) {
                throw new DOMException("Aborted", "AbortError");
            }

            if (!response.ok) {
                throw new Error(`API Request failed with status: ${response.status} ${response.statusText}`);
            }

            const result = await response.json();
            
            if (result.error) {
                throw new Error(result.error);
            }

            return result.verdict; // Expecting the final structured text back
        }

        /**
         * Sets the visible status message for the user.
         */
        function setStatus(message, classes, showSpinner) {
            // IMPORTANT: Ensure elements are not null before accessing classList
            const spinner = document.getElementById('spinner');

            statusMessage.textContent = message;
            statusMessage.className = `mt-6 p-4 rounded-lg flex items-center justify-center font-medium text-sm border ${classes}`;
            statusMessage.classList.remove('hidden');
            
            if (showSpinner) {
                spinner.classList.remove('hidden');
                // Check if spinner is already a child before prepending
                if (statusMessage.firstChild !== spinner) {
                    statusMessage.prepend(spinner);
                }
            } else {
                spinner.classList.add('hidden');
            }

            // Hide status message after 10 seconds if not a persistent error
            if (!showSpinner && !classes.includes('red')) {
                setTimeout(() => statusMessage.classList.add('hidden'), 10000);
            }
        }

        /**
         * Formats the raw response text from the LLM for better display.
         */
        function formatGeminiResponse(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            let html = '';

            lines.forEach(line => {
                if (line.startsWith('**Verdict')) {
                    // Make the Verdict section large and prominent
                    html += `<p class="text-2xl font-bold mb-4 mt-2 text-primary">${line.replace(/\*\*/g, '').trim()}</p>`;
                } else if (line.startsWith('**')) {
                    // Section headers
                    html += `<p class="text-lg font-semibold mt-4 mb-2 text-gray-800">${line.replace(/\*\*/g, '').trim()}</p>`;
                } else {
                    html += `<p class="mb-2">${line.trim()}</p>`;
                }
            });
            return html;
        }
    }); // End DOMContentLoaded
</script>
</body>
</html>
